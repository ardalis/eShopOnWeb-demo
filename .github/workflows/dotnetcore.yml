name: eShopOnWeb Build and Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    env:
      SOLUTION_FILE: ./eShopOnWeb.slnx

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '11.0.x'

    - name: Build with dotnet
      run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release

      # Tests run on Microsoft.Testing.Platform (see global.json); coverage via Microsoft.Testing.Extensions.CodeCoverage
    - name: Test with dotnet
      run: dotnet test --solution ${{ env.SOLUTION_FILE }} --configuration Release --no-build --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml --report-trx --results-directory coverage
      
    - name: Code Coverage Summary Report
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: coverage/coverage.cobertura.xml
        badge: true
        format: 'markdown'
        output: 'both'

    - name: Upload code coverage results artifact
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: code-coverage-results
        path: code-coverage-results.md
        retention-days: 1
    
    - name: Save the PR number in an artifact
      if: github.event_name == 'pull_request' && (success() || failure()) 
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.number }}
      run: echo $PR_NUMBER > pr-number.txt
  
    - name: Upload the PR number
      uses: actions/upload-artifact@v4
      if: github.event_name == 'pull_request' &&  (success() || failure())
      with:
        name: pr-number
        path: ./pr-number.txt
        retention-days: 1
